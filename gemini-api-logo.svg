<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Gemini API — One gateway. Two API formats.</title>
<desc id="desc">An original interlocking gateway symbol in cyan and violet on a dark background, beside the Gemini API wordmark.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1225"/><stop offset="1" stop-color="#171831"/></linearGradient>
  <linearGradient id="brand" x2="1" y2="1"><stop stop-color="#60e1ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="960" height="300" rx="24" fill="url(#bg)"/>
<rect width="960" height="300" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="958" height="298" rx="23" fill="none" stroke="#7c8cab" stroke-opacity=".24"/>
<g transform="translate(55 61)">
  <rect x="0" y="0" width="178" height="178" rx="44" fill="#111e36" stroke="#334666"/>
  <path d="M71 43L29 89l42 46M107 43l42 46-42 46" fill="none" stroke="url(#brand)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 58L82 120" stroke="#d8e6ff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="144" cy="35" r="7" fill="#60e1ff"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="271" y="92" fill="#81d5f5" font-size="12" font-weight="700" letter-spacing="3">SELF-HOSTED · BUILT WITH GO</text>
  <text x="268" y="155" fill="#f4f7ff" font-size="56" font-weight="750" letter-spacing="-2">Gemini <tspan fill="url(#brand)">API</tspan></text>
  <text x="271" y="195" fill="#b1bdd6" font-size="22">One gateway. Two API formats.</text>
  <text x="271" y="233" fill="#8f9fbc" font-size="14" letter-spacing="1">OPENAI COMPATIBLE   /   GEMINI v1beta</text>
</g>
</svg>
